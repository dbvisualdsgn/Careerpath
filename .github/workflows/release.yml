name: Release

# Publishes a GitHub release when the version in package.json changes, with the notes from the
# matching "## <version>" section of CHANGELOG.md. A version that already has a release is skipped.
on:
  push:
    branches: [main]
    paths: [package.json, CHANGELOG.md, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release for this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already has a release."
            exit 0
          fi
          awk -v v="$version" '$0 ~ "^## " v "( |$)" {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version."
            exit 1
          fi
          title="curriculi curricula $(echo "$version" | cut -d. -f1,2)"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file notes.md --latest

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>curriculi curricula</title>
    <meta name="description" content="A quick, calm way to write your CV, check it and share it. Free, no account." />
    <meta name="theme-color" content="#eceae5" />
    <script>
      // Apply the saved "Aa" type style and paper light before first paint.
      try {
        var t = localStorage.getItem('curricula.type');
        if (t === 'serif' || t === 'mono') document.documentElement.dataset.type = t;
        var v = JSON.parse(localStorage.getItem('curricula.paper.vars') || 'null');
        if (v) for (var k in v) if (/^--[\w-]+$/.test(k) && /^#[0-9a-f]{6}$/i.test(v[k])) document.documentElement.style.setProperty(k, v[k]);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/home/main.tsx"></script>
  </body>
</html>

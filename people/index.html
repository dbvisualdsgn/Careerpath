<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ECEAE5'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Georgia,serif' font-size='20' fill='%23111111'%3Ecc%3C/text%3E%3C/svg%3E" />
    <title>Public CVs · curriculi curricula</title>
    <meta name="description" content="CVs people chose to make public on curriculi curricula." />
    <meta name="theme-color" content="#eceae5" />
    <script>
      // Apply the saved "Aa" type style and paper light before first paint.
      try {
        var t = localStorage.getItem('curricula.type');
        if (t === 'serif' || t === 'mono') document.documentElement.dataset.type = t;
        var v = JSON.parse(localStorage.getItem('curricula.paper.vars') || 'null');
        if (v) for (var k in v) if (/^--[\w-]+$/.test(k) && /^#[0-9a-f]{6}$/i.test(v[k])) document.documentElement.style.setProperty(k, v[k]);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/people/main.tsx"></script>
  </body>
</html>
